[project]
name = "decision-agent"
version = "0.1.0"
description = "LangGraph agent on AgentCore, routed and graded by Strands Decider"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.18.1",
    "httpx>=0.27",
    "langchain-aws>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0.2",
    "pydantic>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
